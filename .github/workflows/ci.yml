# Browser tests cannot run on a Windows machine with Smart App Control enforced:
# it blocks Playwright's unsigned WebKit DLLs and the process dies at init with
# 0xC0000142. Linux runners have no such restriction, so CI is the reliable place
# to run `make test`. The OSM and elevation caches are committed, so the build
# needs no network fetch.
name: build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # the release step replaces the downloadable build
  pages: write             # ...and the deploy job publishes the site
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # 24 because that is what the tests are written and run against locally,
      # and because 20 is the runtime GitHub is in the middle of retiring.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build
        run: make

      - name: Test
        run: make test

      # Handy when a run fails and you want to see what it built. Arrives as a
      # zip, and expires - the release below is the copy meant for humans.
      - name: Upload the standalone build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ombra-roma-html
          # version.txt travels with the page: the deployed copy polls it to
          # notice when a browser is holding a cached build. The manifest, the
          # service worker and the icons are what make the Pages copy installable.
          path: |
            dist/ombra-roma.html
            dist/version.txt
            dist/manifest.webmanifest
            dist/sw.js
            dist/icons/
          if-no-files-found: warn

  # The release and Pages deploy jobs that ombra runs here are left out until
  # this repository builds Detroit: until then they would publish Rome under
  # Detroit's name.
